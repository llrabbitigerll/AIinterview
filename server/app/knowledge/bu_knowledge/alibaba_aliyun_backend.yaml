# =====================================================
#  Layer 3: 阿里巴巴 · 阿里云 · 后端 — BU技术知识补丁
# =====================================================

company: 阿里巴巴
company_key: alibaba
bu: 阿里云
bu_key: aliyun
position_type: backend

context_intro: >
  阿里云后端核心挑战：云原生基础设施的稳定性和性能，多租户隔离和资源调度，
  大规模分布式系统的运维和SRE。主技术栈Java/Go，容器化全面Kubernetes，
  自研云产品线丰富。

tech_stack:
  primary_languages: [Java, Go, C++, Python]
  frameworks: [Spring Cloud, gRPC, Dubbo]
  data_pipeline: [Flink, MaxCompute, DataHub]
  storage: [PolarDB, OceanBase, Lindorm, TableStore, OSS]
  infra: [Kubernetes, ACK, FC, SAE, SLS, ARMS]
  ml_platform: [PAI, EAS, DashScope]

core_domains:
  - name: 云原生基础设施
    architecture: "容器编排 → 服务网格 → Serverless → 可观测性"
    keywords: [Kubernetes, 容器, 服务网格, Serverless, 可观测性]
    high_frequency_questions:
      - "Kubernetes调度器的设计原理"
      - "如何实现多租户资源隔离"
      - "容器网络方案对比"

  - name: 数据库服务
    architecture: "存算分离 → 多副本 → 自动扩缩容"
    keywords: [PolarDB, 存算分离, MVCC, Raft, 分布式事务]
    high_frequency_questions:
      - "PolarDB的存算分离架构"
      - "分布式数据库如何保证ACID"

  - name: 大模型服务
    architecture: "模型训练 → 模型推理 → API服务 → 应用集成"
    keywords: [DashScope, 百炼, 模型推理, GPU调度]
    high_frequency_questions:
      - "大模型推理性能优化方案"
      - "GPU资源调度策略"

interview_depth_by_target_level:
  T1_T2:
    focus: "云计算基础概念、Linux系统、网络基础"
    sample_topics: ["容器基础", "Linux进程管理", "TCP/IP"]
    depth: "知其然即可"
  T3_T4:
    focus: "云原生架构、Kubernetes深度、分布式系统原理"
    sample_topics: ["K8s源码级理解", "存算分离架构", "服务网格"]
    depth: "知其所以然，有实战经验"
  T5_T6:
    focus: "云计算战略、技术演进方向、AI与云的融合"
    sample_topics: ["Serverless的未来", "AI Infra架构"]
    depth: "有行业视角和战略判断"

current_pain_points:
  - "大模型训练和推理的成本优化"
  - "多云/混合云场景的挑战"
  - "与AWS/Azure的差异化竞争"

team_specific_culture:
  - "技术硬核，崇尚底层能力"
  - "on-call文化重，稳定性第一"
  - "开源贡献度高"

common_interview_topics:
  - "云原生架构"
  - "分布式系统"
  - "容器化和编排"
  - "网络编程"
  - "性能调优"
  - "系统稳定性"
